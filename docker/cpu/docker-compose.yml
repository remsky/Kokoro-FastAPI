name: kokoro-fastapi-cpu
services:
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:${VERSION:-latest}
    build:
      context: ../..
      dockerfile: docker/cpu/Dockerfile.optimized
      cache_from:
        - ghcr.io/remsky/kokoro-fastapi-cache:cpu-amd64
        - ghcr.io/remsky/kokoro-fastapi-cache:cpu-arm64
    volumes:
      - ../../web:/app/web  # hot reload changes to web player code
    ports:
      - "8880:8880"
    env_file:
      - path: ../../.env
        required: false
    environment:  # full list in docs/configuration.md
      - API_LOG_LEVEL=DEBUG
      # - ALLOW_DEV_UNLOAD=true
      # - ENABLE_DEBUG_ENDPOINTS=true
