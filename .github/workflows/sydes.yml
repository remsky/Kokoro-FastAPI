name: Sydes

# Sydes runs as an independent PR check alongside the repository's existing CI.
# It analyzes what the change can affect and what still lacks verification
# evidence; it does not run this repository's test suite (CI owns that).

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  # Needed only to create/update the single Sydes summary comment on the PR.
  pull-requests: write

concurrency:
  group: sydes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-change:
    name: Sydes verify-change
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Full history: Sydes resolves the change with `git merge-base <base> HEAD`,
      # so both the PR head and the PR base commit must be present locally.
      - name: Check out PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Sydes
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/sydes-ai/sydes.git"

      - name: Run Sydes verify-change
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The impact guide requires the Codebase Memory backend; the default
          # backend is `native`, which would silently skip semantic inference.
          SYDES_CODE_INTELLIGENCE: cbm
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          sydes verify-change \
            --base "$BASE_SHA" \
            --repo app=. \
            --llm-policy auto \
            --impact-guide auto \
            --code-review \
            --model openai:gpt-4.1-mini \
            --no-run-tests \
            --verbose \
            --json sydes-result.json

      # Rendering runs even when the analysis step failed, so the PR still gets
      # an explanation instead of silence.
      - name: Render Sydes summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python .github/scripts/render_sydes_pr.py sydes-result.json \
            --out sydes-comment.md \
            --diagnostics-out sydes-diagnostics.json \
            --run-url "$RUN_URL"
          cat sydes-comment.md >> "$GITHUB_STEP_SUMMARY"
          echo "Wrote $(wc -c < sydes-comment.md) bytes to the job summary."

      - name: Post or update Sydes PR comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- sydes-verification-comment -->';
            const body = fs.readFileSync('sydes-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (comment) => comment.body && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body },
              );
              core.info(`Updated Sydes comment ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment(
                { owner, repo, issue_number, body },
              );
              core.info(`Created Sydes comment ${created.data.id}`);
            }

      - name: Upload Sydes result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sydes-result
          path: |
            sydes-result.json
            sydes-comment.md
            sydes-diagnostics.json
          if-no-files-found: warn
