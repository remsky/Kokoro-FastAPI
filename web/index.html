<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>FastKoko: Kokoro-based TTS</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/editor.css">
    <link rel="stylesheet" href="styles/voices.css">
    <link rel="stylesheet" href="styles/controls.css">
    <link rel="stylesheet" href="styles/player.css">
    <script src="./siriwave.js" defer></script>
</head>
<body>
    <div class="scene" aria-hidden="true">
        <div class="overlay"></div>
        <div class="sun"></div>
        <div class="grid-overlay"></div>
        <div class="scanline"></div>
    </div>

    <header class="app-header">
        <div class="header-inner">
            <div class="logo-container">
                <h1>FastKoko</h1>
                <div class="cup">
                    <div class="handle"></div>
                    <div class="steam"></div>
                </div>
                <a id="version-badge" class="version-badge" href="https://github.com/remsky/Kokoro-FastAPI/releases" target="_blank" rel="noopener" hidden></a>
            </div>
            <div class="header-links">
                <a href="https://huggingface.co/hexgrad/Kokoro-82M" target="_blank" rel="noopener" class="badge hf-badge" aria-label="HexGrad/Kokoro-82M on Hugging Face">
                    <span class="hf-label">
                        <img class="hf-logo" src="hf-logo.svg" alt="" width="14" height="14">
                        <span class="hf-repo"><span class="hf-prefix">Powered by </span>HexGrad/Kokoro-82M</span>
                    </span>
                </a>
                <a href="https://github.com/remsky/Kokoro-FastAPI" target="_blank" rel="noopener" class="badge gh-star-badge" aria-label="Star remsky/Kokoro-FastAPI on GitHub">
                    <span class="gh-star-label">
                        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
                        <span class="gh-repo"><span class="gh-owner">remsky/</span>Kokoro-FastAPI</span>
                    </span>
                    <span id="gh-star-count" class="gh-star-count" hidden></span>
                </a>
            </div>
        </div>
    </header>

    <main class="app-shell">
        <section class="editor-pane">
            <div class="editor-card">
                <div id="text-editor"></div>
                <div class="editor-status-row">
                    <div id="char-count" class="char-count">0 characters</div>
                    <div id="streaming-notice" class="streaming-notice" role="status" hidden></div>
                </div>
            </div>
        </section>

        <aside class="side-pane">
            <section class="voice-card">
                <div class="card-tabs" role="tablist" aria-label="Voice mode">
                    <button type="button" id="voices-tab" class="card-tab is-active" role="tab" aria-selected="true" aria-controls="voice-panel">Voices</button>
                    <button type="button" id="voice-tags-tab" class="card-tab" role="tab" aria-selected="false" aria-controls="voice-panel" tabindex="-1">Voice Tags</button>
                </div>
                <div id="voice-panel" class="voice-panel" role="tabpanel">
                    <div class="voice-select-container">
                        <div class="voice-search-wrapper">
                            <input
                                type="text"
                                id="voice-search"
                                class="voice-search"
                                placeholder="Search voices..."
                                autocomplete="off"
                                aria-label="Search voices"
                            >
                            <div class="voice-dropdown" id="voice-dropdown">
                                <div class="voice-options" id="voice-options"></div>
                            </div>
                        </div>
                        <div class="selected-voices" id="selected-voices"></div>
                        <button type="button" id="create-tag-btn" class="create-tag-btn" hidden>Create tag</button>
                    </div>
                    <div id="voice-cast" class="voice-cast" hidden>
                        <div class="voice-cast-head">
                            <span class="voice-cast-title">Cast</span>
                            <details id="cast-file-menu" class="cast-file-menu">
                                <summary class="cast-file-toggle" title="Save or load the cast" aria-label="Cast file options">▾</summary>
                                <div class="cast-file-panel">
                                    <button type="button" id="save-cast-btn" class="cast-menu-item">Save tags</button>
                                    <button type="button" id="import-cast-btn" class="cast-menu-item">Import (merge)</button>
                                    <button type="button" id="import-cast-replace-btn" class="cast-menu-item">Import (replace)</button>
                                </div>
                            </details>
                            <input type="file" id="import-cast-input" accept="application/json,.json" hidden>
                        </div>
                        <div id="voice-cast-list" class="voice-cast-list"></div>
                        <div id="cast-menu" class="cast-menu" role="menu" hidden>
                            <button type="button" role="menuitem" class="cast-menu-item" data-action="insert">Insert at cursor</button>
                            <button type="button" role="menuitem" class="cast-menu-item" data-action="rename">Rename</button>
                            <button type="button" role="menuitem" class="cast-menu-item" data-action="reset">Reset alias</button>
                            <button type="button" role="menuitem" class="cast-menu-item" data-action="edit">Edit mix</button>
                            <button type="button" role="menuitem" class="cast-menu-item" data-action="strip">Remove from text</button>
                            <button type="button" role="menuitem" class="cast-menu-item" data-action="remove">Remove from cast</button>
                        </div>
                    </div>
                    <div id="voice-tag-notice" class="voice-tag-notice" role="status" hidden>
                        <span id="voice-tag-notice-text"></span>
                        <button type="button" id="remove-voice-tags-btn" class="link-btn">Remove</button>
                    </div>
                </div>
            </section>

            <section class="settings-card">
                <div class="settings-split">
                    <div class="setting-field">
                        <label for="speed-input">Speed</label>
                        <input type="number" id="speed-input" class="speed-input" min="0.1" max="4" step="0.1" value="1.0" title="Playback speed (0.1 to 4)">
                    </div>
                    <div class="setting-field">
                        <label for="lang-select">Language</label>
                        <select id="lang-select" class="lang-select">
                            <option value="">Auto</option>
                            <option value="e">Spanish</option>
                            <option value="a">English</option>
                            <option value="f">French</option>
                            <option value="h">Hindi</option>
                            <option value="i">Italian</option>
                            <option value="p">Portuguese</option>
                            <option value="j">Japanese</option>
                            <option value="z">Chinese</option>
                        </select>
                    </div>
                    <div class="setting-field">
                        <label for="format-select">Format</label>
                        <select id="format-select" class="format-select">
                            <option value="mp3">MP3</option>
                            <option value="wav">WAV</option>
                            <option value="pcm">PCM</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="generate-card">
                <div id="status" class="status" role="status"></div>
                <button id="cancel-btn" style="display: none;">Cancel</button>
                <div class="button-group">
                    <button id="generate-btn">
                        <span class="btn-text">Generate Speech</span>
                        <span class="loader"></span>
                    </button>
                </div>
            </section>
        </aside>
    </main>

    <footer class="player-dock">
        <div id="wave-container" class="wave-container"></div>
        <div class="player-controls">
            <button id="play-pause-btn" class="player-btn" aria-label="Play" title="Play">
                <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path fill="currentColor" d="M8 5.14v13.72L19 12z"/>
                </svg>
                <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path fill="currentColor" d="M6.5 5h3.5v14H6.5zM14 5h3.5v14H14z"/>
                </svg>
            </button>
            <label class="autoplay-toggle">
                <input type="checkbox" id="autoplay-toggle" aria-label="Auto-play" checked>
                <span class="autoplay-text">Auto</span>
            </label>
            <input type="range" id="seek-slider" class="seek-slider" min="0" max="100" value="0" aria-label="Playback position">
            <span id="time-display" class="time-display">0:00</span>
            <div class="download-wrap">
                <div id="download-btn" class="download-button" role="button" tabindex="0" aria-label="Download" aria-haspopup="menu" aria-expanded="false">
                    <div class="download-glow"></div>
                    <div class="download-icon">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M8 11L4 7h8l-4 4z" fill="currentColor"/>
                            <path d="M8 3v8M4 14h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
                <div id="download-menu" class="download-menu" role="menu" hidden>
                    <button type="button" role="menuitem" data-download="audio">Download Audio</button>
                    <button type="button" role="menuitem" data-download="timings">Download Timings</button>
                    <button type="button" role="menuitem" data-download="both">Download Both</button>
                </div>
            </div>
            <div class="volume-control">
                <svg class="volume-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path fill="currentColor" d="M12,4L9.91,6.09L12,8.18M4.27,3L3,4.27L7.73,9H3V15H7L12,20V13.27L16.25,17.53C15.58,18.04 14.83,18.46 14,18.7V20.77C15.38,20.45 16.63,19.82 17.68,18.96L19.73,21L21,19.73L12,10.73M19,12C19,12.94 18.8,13.82 18.46,14.64L19.97,16.15C20.62,14.91 21,13.5 21,12C21,7.72 18,4.14 14,3.23V5.29C16.89,6.15 19,8.83 19,12M16.5,12C16.5,10.23 15.5,8.71 14,7.97V10.18L16.45,12.63C16.5,12.43 16.5,12.21 16.5,12Z"/>
                </svg>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100" aria-label="Volume">
            </div>
            <a href="https://www.buymeacoffee.com/remsky" target="_blank" rel="noopener" class="bmc-link" aria-label="Buy me a coffee">
                <img src="bmc-logo.svg" alt="Buy me a coffee">
            </a>
        </div>
    </footer>

    <script type="module" src="src/App.js"></script>
</body>
</html>
